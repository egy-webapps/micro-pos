<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mob Control - Ultimate Edition</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            font-family: 'Cairo', sans-serif;
        }

        body, html {
            width: 100vw;
            height: 100dvh;
            overflow: hidden;
            background: #0f172a;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #game-container {
            position: relative;
            width: 100%;
            max-width: 480px;
            height: 100dvh;
            background: #1e293b;
            box-shadow: 0 0 30px rgba(0,0,0,0.5);
            overflow: hidden;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* Top HUD */
        #hud {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
            pointer-events: none;
        }

        .badge {
            background: rgba(15, 23, 42, 0.9);
            color: #fff;
            padding: 6px 16px;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 900;
            display: flex;
            align-items: center;
            gap: 8px;
            border: 2px solid rgba(255,255,255,0.15);
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .coin-icon {
            color: #facc15;
            font-size: 18px;
        }

        /* Start & Upgrades Overlay */
        #start-screen {
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(15, 23, 42, 0.95), rgba(30, 41, 59, 0.95));
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 60px 15px 25px;
            z-index: 20;
        }

        .game-title {
            text-align: center;
            color: #fff;
            text-shadow: 0 4px 0 #0284c7;
        }

        .game-title h1 {
            font-size: 40px;
            font-weight: 900;
            letter-spacing: 1px;
        }

        .play-hint {
            background: #22c55e;
            color: white;
            padding: 14px 45px;
            border-radius: 50px;
            font-size: 22px;
            font-weight: 900;
            border: 3px solid #fff;
            box-shadow: 0 6px 0 #15803d, 0 10px 20px rgba(0,0,0,0.4);
            cursor: pointer;
            animation: bounce 1.2s infinite alternate;
        }

        @keyframes bounce {
            from { transform: translateY(0); }
            to { transform: translateY(-6px); }
        }

        /* Upgrades Grid */
        .upgrades-panel {
            width: 100%;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        .upgrade-card {
            background: #fff;
            border-radius: 14px;
            padding: 10px 4px;
            text-align: center;
            box-shadow: 0 6px 0 #cbd5e1;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .upgrade-card:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #cbd5e1;
        }

        .upgrade-card.disabled {
            opacity: 0.5;
            filter: grayscale(1);
            cursor: not-allowed;
        }

        .upg-icon { font-size: 24px; }
        .upg-title { font-size: 11px; font-weight: 900; color: #1e293b; margin-top: 2px; }
        .upg-lvl { font-size: 10px; color: #64748b; font-weight: 700; }
        .upg-cost { background: #facc15; color: #713f12; font-size: 12px; font-weight: 900; padding: 3px 0; border-radius: 6px; margin-top: 4px; }

        /* End Screen Modal */
        #end-screen {
            position: absolute;
            inset: 0;
            background: rgba(15, 23, 42, 0.85);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            z-index: 30;
            text-align: center;
        }

        #end-title { font-size: 40px; font-weight: 900; margin-bottom: 10px; }
        .win-text { color: #4ade80; text-shadow: 0 4px 0 #166534; }
        .lose-text { color: #f87171; text-shadow: 0 4px 0 #991b1b; }
        #end-reward { color: #facc15; font-size: 24px; font-weight: 900; margin-bottom: 25px; }

        #next-btn {
            background: #3b82f6;
            color: #fff;
            border: 3px solid #fff;
            padding: 14px 40px;
            border-radius: 50px;
            font-size: 20px;
            font-weight: 900;
            box-shadow: 0 6px 0 #1d4ed8;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div id="game-container">
    <div id="hud">
        <div class="badge">المستوى <span id="level-display">1</span></div>
        <div class="badge"><span class="coin-icon">🪙</span> <span id="coins-display">150</span></div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <!-- Start Screen -->
    <div id="start-screen">
        <div class="game-title">
            <h1>MOB CONTROL</h1>
            <p style="font-size: 14px; background: rgba(255,255,255,0.1); padding: 4px 12px; border-radius: 20px; margin-top: 6px;">اسحب يميناً ويساراً للإطلاق والسيطرة</p>
        </div>

        <button class="play-hint" id="start-btn">بدء المعركة ⚔️</button>

        <div class="upgrades-panel">
            <div class="upgrade-card" id="upg-fire" onclick="buyUpgrade('fire')">
                <div class="upg-icon">🔥</div>
                <div class="upg-title">سرعة الإطلاق</div>
                <div class="upg-lvl" id="lvl-fire">مستوى 1</div>
                <div class="upg-cost" id="cost-fire">50 🪙</div>
            </div>
            <div class="upgrade-card" id="upg-giant" onclick="buyUpgrade('giant')|">
                <div class="upg-icon">🦍</div>
                <div class="upg-title">قوة العملاق</div>
                <div class="upg-lvl" id="lvl-giant">مستوى 1</div>
                <div class="upg-cost" id="cost-giant">75 🪙</div>
            </div>
            <div class="upgrade-card" id="upg-income" onclick="buyUpgrade('income')">
                <div class="upg-icon">💰</div>
                <div class="upg-title">مضاعفة الذهب</div>
                <div class="upg-lvl" id="lvl-income">مستوى 1</div>
                <div class="upg-cost" id="cost-income">60 🪙</div>
            </div>
        </div>
    </div>

    <!-- Win/Lose Screen -->
    <div id="end-screen">
        <div id="end-title" class="win-text">انتصار ساحق!</div>
        <div id="end-reward">+200 🪙</div>
        <button id="next-btn" onclick="resetToMenu()">المستوى التالي</button>
    </div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const container = document.getElementById('game-container');

    let state = {
        coins: parseInt(localStorage.getItem('mc_coins')) || 150,
        level: parseInt(localStorage.getItem('mc_level')) || 1,
        fireLvl: parseInt(localStorage.getItem('mc_fire')) || 1,
        giantLvl: parseInt(localStorage.getItem('mc_giant')) || 1,
        incomeLvl: parseInt(localStorage.getItem('mc_income')) || 1,
        isPlaying: false,
        isFiring: false
    };

    function saveData() {
        localStorage.setItem('mc_coins', state.coins);
        localStorage.setItem('mc_level', state.level);
        localStorage.setItem('mc_fire', state.fireLvl);
        localStorage.setItem('mc_giant', state.giantLvl);
        localStorage.setItem('mc_income', state.incomeLvl);
        updateUI();
    }

    function getCost(type) {
        if (type === 'fire') return Math.floor(50 * Math.pow(1.4, state.fireLvl - 1));
        if (type === 'giant') return Math.floor(75 * Math.pow(1.45, state.giantLvl - 1));
        if (type === 'income') return Math.floor(60 * Math.pow(1.4, state.incomeLvl - 1));
    }

    function updateUI() {
        document.getElementById('coins-display').innerText = state.coins;
        document.getElementById('level-display').innerText = state.level;
        ['fire', 'giant', 'income'].forEach(type => {
            const cost = getCost(type);
            document.getElementById('lvl-' + type).innerText = `مستوى ${state[type + 'Lvl']}`;
            document.getElementById('cost-' + type).innerText = `${cost} 🪙`;
            const card = document.getElementById('upg-' + type);
            if (state.coins < cost) card.classList.add('disabled');
            else card.classList.remove('disabled');
        });
    }

    function buyUpgrade(type) {
        const cost = getCost(type);
        if (state.coins >= cost) {
            state.coins -= cost;
            state[type + 'Lvl']++;
            saveData();
        }
    }

    let W, H;
    function resize() {
        W = canvas.width = container.clientWidth;
        H = canvas.height = container.clientHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    const roadTopY = () => H * 0.15;
    const roadBottomY = () => H * 0.88;
    const roadTopWidth = () => W * 0.50;
    const roadBottomWidth = () => W * 0.92;

    function getRoadBounds(y) {
        const t = Math.max(0, Math.min(1, (y - roadTopY()) / (roadBottomY() - roadTopY())));
        const currentW = roadTopWidth() + (roadBottomWidth() - roadTopWidth()) * t;
        const left = (W - currentW) / 2;
        return { left, right: left + currentW, width: currentW, scale: 0.5 + 0.5 * t };
    }

    let cannon = { x: W / 2, charge: 0, maxCharge: 100 };
    let base = { hp: 100, maxHp: 100 };
    let mobs = [];
    let gates = [];
    let particles = [];
    let lastShotTime = 0;
    let lastEnemySpawn = 0;

    function initLevel() {
        cannon.x = W / 2;
        cannon.charge = 0;
        mobs = [];
        particles = [];
        base.maxHp = 50 + state.level * 40;
        base.hp = base.maxHp;

        gates = [];
        const midY1 = roadTopY() + (roadBottomY() - roadTopY()) * 0.35;
        const midY2 = roadTopY() + (roadBottomY() - roadTopY()) * 0.65;

        gates.push({ normX: -0.2, y: midY2, normW: 0.38, type: 'mul', val: 2, vx: 0.003 });
        if (state.level >= 2) {
            gates.push({ normX: 0.2, y: midY1, normW: 0.35, type: 'add', val: 5 + state.level * 2, vx: -0.003 });
        }
    }

    function spawnMob(x, y, team, isGiant = false, passedGates = new Set()) {
        const bounds = getRoadBounds(y);
        const clampedX = Math.max(bounds.left + 10, Math.min(bounds.right - 10, x));
        const giantHp = 5 + state.giantLvl * 3;
        mobs.push({ x: clampedX, y, team, isGiant, hp: isGiant ? giantHp : 1, passedGates: new Set(passedGates), anim: Math.random() * 10 });
    }

    function spawnParticles(x, y, color, count = 5) {
        for (let i = 0; i < count; i++) {
            particles.push({ x, y, vx: (Math.random() - 0.5) * 5, vy: (Math.random() - 0.5) * 5, life: 1, color });
        }
    }

    function handleInputMove(clientX) {
        if (!state.isPlaying) return;
        const rect = canvas.getBoundingClientRect();
        const relX = clientX - rect.left;
        const bounds = getRoadBounds(roadBottomY());
        cannon.x = Math.max(bounds.left + 20, Math.min(bounds.right - 20, relX));
    }

    canvas.addEventListener('touchstart', (e) => { e.preventDefault(); if(state.isPlaying){ state.isFiring = true; handleInputMove(e.touches[0].clientX); } }, { passive: false });
    canvas.addEventListener('touchmove', (e) => { e.preventDefault(); if(state.isPlaying) handleInputMove(e.touches[0].clientX); }, { passive: false });
    canvas.addEventListener('touchend', () => { state.isFiring = false; });

    canvas.addEventListener('mousedown', (e) => { if(state.isPlaying){ state.isFiring = true; handleInputMove(e.clientX); } });
    window.addEventListener('mousemove', (e) => { if(state.isFiring) handleInputMove(e.clientX); });
    window.addEventListener('mouseup', () => { state.isFiring = false; });

    document.getElementById('start-btn').addEventListener('click', () => {
        document.getElementById('start-screen').style.display = 'none';
        initLevel();
        state.isPlaying = true;
    });

    function resetToMenu() {
        document.getElementById('end-screen').style.display = 'none';
        document.getElementById('start-screen').style.display = 'flex';
        updateUI();
    }

    function endGame(win) {
        state.isPlaying = false;
        state.isFiring = false;
        const endScreen = document.getElementById('end-screen');
        const endTitle = document.getElementById('end-title');
        const endReward = document.getElementById('end-reward');

        if (win) {
            const reward = Math.floor((70 + state.level * 25) * (1 + (state.incomeLvl - 1) * 0.2));
            state.coins += reward;
            state.level++;
            endTitle.innerText = "انتصار ساحق! 🏆";
            endTitle.className = "win-text";
            endReward.innerText = `+${reward} 🪙`;
        } else {
            const reward = 10;
            state.coins += reward;
            endTitle.innerText = "هزيمة! حاول مجدداً 💥";
            endTitle.className = "lose-text";
            endReward.innerText = `+${reward} 🪙`;
        }
        saveData();
        endScreen.style.display = 'flex';
    }

    function update(timestamp) {
        if (!state.isPlaying) return;

        const fireDelay = Math.max(80, 300 - (state.fireLvl - 1) * 22);
        if (state.isFiring && timestamp - lastShotTime > fireDelay) {
            lastShotTime = timestamp;
            if (cannon.charge >= cannon.maxCharge) {
                spawnMob(cannon.x, roadBottomY() - 20, 'blue', true);
                cannon.charge = 0;
                spawnParticles(cannon.x, roadBottomY() - 25, '#facc15', 10);
            } else {
                spawnMob(cannon.x + (Math.random() - 0.5) * 12, roadBottomY() - 15, 'blue', false);
                cannon.charge = Math.min(cannon.maxCharge, cannon.charge + 12);
            }
        }

        const enemyInterval = Math.max(650, 1800 - state.level * 100);
        if (timestamp - lastEnemySpawn > enemyInterval) {
            lastEnemySpawn = timestamp;
            const waveSize = Math.min(7, 2 + Math.floor(state.level / 2));
            const topB = getRoadBounds(roadTopY() + 15);
            const spawnX = topB.left + 25 + Math.random() * (topB.width - 50);
            for (let i = 0; i < waveSize; i++) {
                spawnMob(spawnX + (Math.random() - 0.5) * 30, roadTopY() + 20, 'red', false);
            }
        }

        gates.forEach(g => {
            g.normX += g.vx;
            if (g.normX > 0.25 || g.normX < -0.25) g.vx *= -1;
        });

        const speed = H * 0.0034;
        for (let i = mobs.length - 1; i >= 0; i--) {
            let m = mobs[i];
            m.anim += 0.2;
            const bounds = getRoadBounds(m.y);

            if (m.team === 'blue') {
                m.y -= m.isGiant ? speed * 0.75 : speed;
                const relPos = (m.x - W / 2) / (bounds.width / 2);
                m.x = W / 2 + Math.max(-0.9, Math.min(0.9, relPos)) * (bounds.width / 2);

                gates.forEach((g, gIdx) => {
                    if (!m.passedGates.has(gIdx) && Math.abs(m.y - g.y) < 10) {
                        const gCenter = W / 2 + g.normX * bounds.width;
                        const gHalfW = (g.normW * bounds.width) / 2;
                        if (Math.abs(m.x - gCenter) < gHalfW) {
                            m.passedGates.add(gIdx);
                            let count = g.type === 'mul' ? g.val - 1 : g.val;
                            if (mobs.size < 250) {
                                for (let k = 0; k < count; k++) {
                                    spawnMob(m.x + (Math.random() - 0.5) * 20, m.y, 'blue', m.isGiant, m.passedGates);
                                }
                            }
                            spawnParticles(m.x, m.y, '#38bdf8', 3);
                        }
                    }
                });

                if (m.y <= roadTopY() + 10) {
                    base.hp -= m.hp;
                    spawnParticles(m.x, roadTopY(), '#ef4444', 5);
                    mobs.splice(i, 1);
                    if (base.hp <= 0) { endGame(true); return; }
                }
            } else {
                m.y += speed * 0.8;
                const relPos = (m.x - W / 2) / (bounds.width / 2);
                m.x = W / 2 + Math.max(-0.9, Math.min(0.9, relPos)) * (bounds.width / 2);

                if (m.y >= roadBottomY() - 20) { endGame(false); return; }
            }
        }

        // Collisions
        for (let i = mobs.length - 1; i >= 0; i--) {
            let a = mobs[i];
            if (!a || a.team !== 'blue') continue;
            for (let j = mobs.length - 1; j >= 0; j--) {
                let b = mobs[j];
                if (!b || b.team !== 'red') continue;
                const hitDist = a.isGiant ? 20 : 12;
                if (Math.abs(a.x - b.x) < hitDist && Math.abs(a.y - b.y) < hitDist) {
                    b.hp--; a.hp--;
                    if (b.hp <= 0) mobs.splice(j, 1);
                    if (a.hp <= 0) { mobs.splice(i, 1); break; }
                }
            }
        }

        for (let i = particles.length - 1; i >= 0; i--) {
            let p = particles[i];
            p.x += p.vx; p.y += p.vy; p.life -= 0.06;
            if (p.life <= 0) particles.splice(i, 1);
        }
    }

    function draw() {
        ctx.clearRect(0, 0, W, H);

        // Background Sky
        ctx.fillStyle = '#0284c7';
        ctx.fillRect(0, 0, W, roadTopY());

        // Ground Arena
        ctx.fillStyle = '#0f172a';
        ctx.fillRect(0, roadTopY(), W, H - roadTopY());

        const topB = getRoadBounds(roadTopY());
        const botB = getRoadBounds(roadBottomY());

        // Road Border Walls
        ctx.fillStyle = '#334155';
        ctx.beginPath();
        ctx.moveTo(topB.left - 6, roadTopY());
        ctx.lineTo(topB.right + 6, roadTopY());
        ctx.lineTo(botB.right + 10, roadBottomY() + 15);
        ctx.lineTo(botB.left - 10, roadBottomY() + 15);
        ctx.closePath();
        ctx.fill();

        // Main Road
        ctx.fillStyle = '#475569';
        ctx.beginPath();
        ctx.moveTo(topB.left, roadTopY());
        ctx.lineTo(topB.right, roadTopY());
        ctx.lineTo(botB.right, roadBottomY() + 15);
        ctx.lineTo(botB.left, roadBottomY() + 15);
        ctx.closePath();
        ctx.fill();

        // Center dashed line
        ctx.strokeStyle = 'rgba(255,255,255,0.2)';
        ctx.lineWidth = 3;
        ctx.setLineDash([15, 15]);
        ctx.beginPath();
        ctx.moveTo(W / 2, roadTopY());
        ctx.lineTo(W / 2, roadBottomY());
        ctx.stroke();
        ctx.setLineDash([]);

        // Enemy Castle Base
        const castleW = topB.width * 0.7;
        const castleH = 50;
        const castleX = (W - castleW) / 2;
        const castleY = roadTopY() - 28;

        ctx.fillStyle = '#dc2626';
        ctx.beginPath();
        ctx.roundRect(castleX, castleY, castleW, castleH, 10);
        ctx.fill();
        ctx.strokeStyle = '#991b1b';
        ctx.lineWidth = 3;
        ctx.stroke();

        ctx.fillStyle = '#fff';
        ctx.font = '900 16px Cairo';
        ctx.textAlign = 'center';
        ctx.fillText(`🏰 قلاع العدو: ${Math.max(0, base.hp)}`, W / 2, castleY + 31);

        // Gates
        gates.forEach(g => {
            const b = getRoadBounds(g.y);
            const gw = g.normW * b.width;
            const gx = W / 2 + g.normX * b.width - gw / 2;
            const gh = 32 * b.scale;

            ctx.fillStyle = 'rgba(14, 165, 233, 0.4)';
            ctx.strokeStyle = '#38bdf8';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.roundRect(gx, g.y - gh / 2, gw, gh, 6);
            ctx.fill();
            ctx.stroke();

            ctx.fillStyle = '#fff';
            ctx.font = `900 ${Math.floor(16 * b.scale)}px Cairo`;
            ctx.textAlign = 'center';
            ctx.fillText(g.type === 'mul' ? `x${g.val}` : `+${g.val}`, gx + gw / 2, g.y + 6 * b.scale);
        });

        mobs.sort((a, b) => a.y - b.y);

        // Mobs
        mobs.forEach(m => {
            const b = getRoadBounds(m.y);
            const r = (m.isGiant ? 12 : 5.5) * b.scale;
            const bounce = Math.abs(Math.sin(m.anim)) * 2.5 * b.scale;

            ctx.fillStyle = m.team === 'blue' ? (m.isGiant ? '#f59e0b' : '#38bdf8') : '#ef4444';
            ctx.beginPath();
            ctx.arc(m.x, m.y - bounce, r, 0, Math.PI * 2);
            ctx.fill();
        });

        particles.forEach(p => {
            ctx.globalAlpha = Math.max(0, p.life);
            ctx.fillStyle = p.color;
            ctx.beginPath();
            ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
            ctx.fill();
        });
        ctx.globalAlpha = 1;

        // Player Cannon
        const cy = roadBottomY();
        const isCharged = cannon.charge >= cannon.maxCharge;

        ctx.strokeStyle = 'rgba(255,255,255,0.2)';
        ctx.lineWidth = 5;
        ctx.beginPath();
        ctx.arc(cannon.x, cy + 5, 30, 0, Math.PI * 2);
        ctx.stroke();

        ctx.strokeStyle = isCharged ? '#facc15' : '#38bdf8';
        ctx.lineWidth = 5;
        ctx.beginPath();
        ctx.arc(cannon.x, cy + 5, 30, -Math.PI / 2, -Math.PI / 2 + (Math.PI * 2 * (cannon.charge / cannon.maxCharge)));
        ctx.stroke();

        ctx.fillStyle = isCharged ? '#eab308' : '#334155';
        ctx.beginPath();
        ctx.roundRect(cannon.x - 12, cy - 24, 24, 32, 6);
        ctx.fill();
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 2;
        ctx.stroke();
    }

    function loop(timestamp) {
        update(timestamp);
        draw();
        requestAnimationFrame(loop);
    }

    updateUI();
    initLevel();
    requestAnimationFrame(loop);
</script>
</body>
</html>
