<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مدفع الحشود</title><meta name="theme-color" content="#0b1d3a">
<style>
:root{--bg:#0b1d3a;--fg:#fff;--card:rgba(10,25,55,.88);--acc:#ffc928;--btn:#2e8bff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#07142b;--card:rgba(6,16,38,.92)}}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,"Segoe UI",Tahoma,sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#hud{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;display:none;justify-content:space-between;padding:10px 12px;font-weight:700;font-size:15px;pointer-events:none}
#hud span{background:var(--card);padding:6px 10px;border-radius:12px}
.ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:20px;text-align:center}
.ov.hide{display:none}#shop{overflow-y:auto;justify-content:flex-start;padding-top:56px;touch-action:pan-y}.ov h1{font-size:40px;margin:0;color:var(--acc);text-shadow:0 3px 0 #b5340f}
.card{background:var(--card);border-radius:18px;padding:14px;width:min(340px,100%);display:flex;flex-direction:column;gap:10px}
button{font:inherit;font-weight:800;font-size:18px;border:0;border-radius:14px;padding:13px 18px;color:#fff;background:var(--btn);box-shadow:0 4px 0 rgba(0,0,0,.35);width:min(300px,100%)}
button.g{background:#27ae60}button.y{background:#e0a100}button.s{background:#556}button:disabled{opacity:.45}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:15px}.row button{width:auto;font-size:15px;padding:9px 12px}
</style></head><body>
<canvas id="c"></canvas>
<div id="hud"><span id="hl">المستوى 1</span><span id="ha">الذخيرة 0</span><span id="hh">العدو 0</span><span id="hc">🪙 0</span></div>
<div class="ov" id="menu"><h1>مدفع الحشود</h1><div class="card"><div id="mi" class="row"></div></div>
<button class="g" id="go">ابدأ اللعب</button><button class="y" id="shopb">التطويرات</button><button class="g" id="dg">🎁 هدية يومية</button><button class="s" id="snb">🔊 الصوت: تشغيل</button>
<div style="font-size:13px;opacity:.8">المس الشاشة واثبت صباعك لتطلق، وحرّكه يمينًا ويسارًا للتصويب</div></div>
<div class="ov hide" id="shop"><div class="card"><h2 style="margin:0">التطويرات</h2><div id="sc" class="row"></div><div id="sl" style="display:flex;flex-direction:column;gap:10px"></div></div><button class="s" id="sb">رجوع</button></div>
<div class="ov hide" id="end" style="background:rgba(0,0,0,.45)"><h1 id="et"></h1><div class="card" id="em"></div><button class="g" id="en"></button><button class="s" id="eh">القائمة</button></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $=i=>document.getElementById(i);
let S={coins:0,level:1,best:1,up:{rate:0,count:0,ammo:0}};
try{Object.assign(S,JSON.parse(localStorage.getItem('mc_save')||'{}'))}catch(e){}
S.up=Object.assign({rate:0,count:0,ammo:0,time:0},S.up);S.oc=S.oc||[0];S.om=S.om||[0];S.cs=S.cs||0;S.ms=S.ms||0;
const save=()=>{try{localStorage.setItem('mc_save',JSON.stringify(S))}catch(e){}};
const R=new THREE.WebGLRenderer({canvas:$('c'),antialias:true});R.setPixelRatio(Math.min(devicePixelRatio,2));
const sc=new THREE.Scene();sc.background=new THREE.Color(0x7fd0ff);sc.fog=new THREE.Fog(0x7fd0ff,25,75);
const cam=new THREE.PerspectiveCamera(62,1,.1,200);
sc.add(new THREE.HemisphereLight(0xffffff,0x6a8f5a,.95));const dl=new THREE.DirectionalLight(0xffffff,.7);dl.position.set(4,10,6);sc.add(dl);
function rs(){R.setSize(innerWidth,innerHeight,false);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()}addEventListener('resize',rs);rs();
const MAX=450,mobGeo=new THREE.SphereGeometry(.3,8,8),inst=new THREE.InstancedMesh(mobGeo,new THREE.MeshLambertMaterial({color:0xffd23f}),MAX);inst.frustumCulled=false;sc.add(inst);
const cannon=new THREE.Group(),barrel=new THREE.Mesh(new THREE.CylinderGeometry(.35,.5,1.8,12),new THREE.MeshLambertMaterial({color:0x34495e}));
barrel.rotation.x=Math.PI/2;barrel.position.z=-.8;const cb=new THREE.Mesh(new THREE.CylinderGeometry(.9,1.1,.7,16),new THREE.MeshLambertMaterial({color:0xe67e22}));cb.position.y=.2;
cannon.add(barrel,cb);cannon.position.set(0,.5,2);sc.add(cannon);
let hold=false,LG=null,G=null,mobs=[],fx=[],aim=0,state='menu',dummy=new THREE.Object3D(),camZ=8;
function rng(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function tex(t,c){const k=document.createElement('canvas');k.width=256;k.height=128;const x=k.getContext('2d');x.fillStyle=c;x.fillRect(0,0,256,128);x.strokeStyle='#fff';x.lineWidth=8;x.strokeRect(4,4,248,120);x.fillStyle='#fff';x.font='bold 84px sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText(t,128,68);return new THREE.CanvasTexture(k)}
const box=(w,h,d,c)=>new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshLambertMaterial({color:c}));
function gen(L){
 const r=rng(L*9973+7),len=45+Math.min(L,50),W=4.5,g={L,len,gates:[],obs:[],ammo:0,hp:0,t:0,fire:0,over:false,coins:[],earn:0,bn:false,bonus:0};
 if(LG)sc.remove(LG);LG=new THREE.Group();sc.add(LG);
 const tr=box(W*2,.4,len+57,0x58c36a);tr.position.set(0,-.2,-len/2-16.5);LG.add(tr);
 for(const s of[-1,1]){const w=box(.4,.8,len+57,0xf1c40f);w.position.set(s*(W+.2),.2,-len/2-16.5);LG.add(w)}
 const rows=Math.min(3+Math.floor(L/8),7),pool=L<6?[2,2,3]:[2,3,3,5],col={2:'#2e8bff',3:'#27ae60',5:'#a64dff'};
 for(let i=0;i<rows;i++){const z=-(12+(len-26)*(i+.5)/rows),two=r()<.55;
  for(let k=0;k<(two?2:1);k++){const m=pool[Math.floor(r()*pool.length)],x=two?(k?2.2:-2.2):(r()-.5)*4;
   const mesh=new THREE.Mesh(new THREE.PlaneGeometry(4.1,2.4),new THREE.MeshBasicMaterial({map:tex('×'+m,col[m]),transparent:true,opacity:.85,side:THREE.DoubleSide}));
   mesh.position.set(x,1.3,z);LG.add(mesh);g.gates.push({x,z,w:4.1,m,id:g.gates.length,mesh,pulse:0})}}
 const n=Math.min(8+Math.floor(L*.9),40);
 for(let i=0;i<n;i++){const w=1.4+r()*1.8,x=(r()-.5)*(W*2-w-.6),z=-(10+r()*(len-20)),mv=L>4&&r()<.4;
  const mesh=box(w,1.2,1,0xe74c3c);mesh.position.set(x,.6,z);LG.add(mesh);g.obs.push({mesh,x,bx:x,z,w,d:1,hp:3+Math.floor(L/4),sp:mv?1+r()*1.5:0,ph:r()*6,dead:false})}
 g.hp=Math.round(40+L*9+L*L*.08);g.ammo=14+Math.floor(L/3)+S.up.ammo*4;g.ammo0=g.ammo;g.cnt=1+S.up.count;g.iv=.28/(1+S.up.rate*.18);
 g.base=box(9,3,2,0xc0392b);g.base.position.set(0,1.5,-len);LG.add(g.base);const tw=box(2,2,2,0x922b21);tw.position.set(0,4,-len);LG.add(tw);
 g.tw=tw;for(let i=0;i<8+Math.min(L,20);i++)g.coins.push(mkCoin((Math.random()-.5)*7.6,-(8+Math.random()*(len-14)),2));
 G=g;mobs=[];aim=0;camZ=8;cannon.rotation.y=0}
function burst(x,z,c){for(let i=0;i<10;i++){const m=new THREE.Mesh(mobGeo,new THREE.MeshBasicMaterial({color:c,transparent:true}));m.position.set(x,.7,z);m.scale.setScalar(.8);sc.add(m);fx.push({m,vx:(Math.random()-.5)*8,vy:Math.random()*6,vz:(Math.random()-.5)*8,t:.6})}}
function fire(){for(let i=0;i<G.cnt&&mobs.length<MAX;i++)mobs.push({x:Math.sin(aim*.5)*1.6+(Math.random()-.5)*.5,z:1.2,vx:aim*5+(Math.random()-.5)*.8,p:0})}
function update(dt){
 G.t+=dt;G.fire-=dt;
 if((G.ammo>0||G.bn)&&G.fire<=0&&hold){G.fire=G.iv;if(!G.bn)G.ammo--;fire()}
 cannon.rotation.y=-aim*.6;
 for(const o of G.obs){if(o.dead||!o.sp)continue;o.x=o.bx+Math.sin(G.t*o.sp+o.ph)*1.4;o.x=Math.max(-4.4+o.w/2,Math.min(4.4-o.w/2,o.x));o.mesh.position.x=o.x}
 for(let i=mobs.length-1;i>=0;i--){const m=mobs[i];let pz=m.z;m.z-=9*dt;m.x+=m.vx*dt;
  if(m.x>4.3){m.x=4.3;m.vx=-m.vx}else if(m.x<-4.3){m.x=-4.3;m.vx=-m.vx}
  let dead=false;
  for(const g of G.gates){if(m.p&(1<<g.id))continue;if(pz>=g.z&&m.z<g.z&&Math.abs(m.x-g.x)<g.w/2){m.p|=1<<g.id;if(g.pulse<=0)beep(520,.08);g.pulse=.3;for(let k=1;k<g.m&&mobs.length<MAX;k++)mobs.push({x:m.x+(Math.random()-.5)*.6,z:m.z-.2*k,vx:m.vx+(Math.random()-.5)*1.5,p:m.p})}}
  for(const o of G.obs){if(o.dead)continue;if(Math.abs(m.x-o.x)<o.w/2+.25&&Math.abs(m.z-o.z)<.8){dead=true;o.hp--;if(o.hp<=0){o.dead=true;o.mesh.visible=false;burst(o.x,o.z,0xe74c3c)}break}}
  for(const c of G.coins){if(!c.got&&Math.abs(m.x-c.x)<.7&&Math.abs(m.z-c.z)<.7){c.got=true;c.mesh.visible=false;G.earn+=c.v;beep(880,.05)}}
  if(!dead&&G.bn&&m.z<-G.len-42)dead=true;
  if(!dead&&!G.bn&&m.z<-G.len+1.6){dead=true;G.hp--;G.base.scale.y=1.15;setTimeout(()=>{if(G)G.base.scale.y=1},80);burst(m.x,m.z,0xffd23f)}
  if(dead){mobs[i]=mobs[mobs.length-1];mobs.pop()}}
 for(const g of G.gates){g.pulse=Math.max(0,g.pulse-dt);g.mesh.scale.setScalar(1+g.pulse)}
 if(G.bn){G.bonus-=dt;if(G.bonus<=0)finish(true)}else if(G.hp<=0)bonus();else if(G.ammo<=0&&!mobs.length)finish(false)}
const coinGeo=new THREE.CylinderGeometry(.35,.35,.1,12),coinMat=new THREE.MeshLambertMaterial({color:0xffd700,emissive:0x664400});
function mkCoin(x,z,v){const m=new THREE.Mesh(coinGeo,coinMat);m.rotation.x=Math.PI/2;m.position.set(x,.7,z);LG.add(m);return{x,z,v,got:false,mesh:m}}
let AC=null,snd=true;function beep(f,d){if(!snd)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=f;g.gain.value=.05;o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(e){}}
function bonus(){G.bn=true;G.bonus=5+(S.up.time||0)*1.5;G.base.visible=false;G.tw.visible=false;for(let r=0;r<9;r++)for(let k=0;k<7;k++)G.coins.push(mkCoin(-4+k*1.33+(r%2)*.6,-G.len-6-r*3.5,1));beep(660,.2)}
function finish(w){if(G.over)return;G.over=true;state='end';const L=G.L;let m;
 if(w){const c=10+L*2+G.earn;S.coins+=c;beep(660,.3);S.level=L+1;S.best=Math.max(S.best,S.level);m='ربحت '+c+' 🪙<br>أعلى مستوى: '+S.best}else{S.coins+=G.earn;m='نفدت الذخيرة قبل تدمير القاعدة'+(G.earn?'<br>جمعت '+G.earn+' 🪙':'')}
 save();$('et').textContent=w?'فزت! 🎉':'خسرت';$('em').innerHTML=m;$('en').textContent=w?'المستوى التالي':'إعادة المحاولة';$('end').classList.remove('hide');$('hud').style.display='none'}
function start(){gen(S.level);state='play';['menu','shop','end'].forEach(i=>$(i).classList.add('hide'));$('hud').style.display='flex'}
function menu(){state='menu';$('mi').innerHTML='<span>المستوى '+S.level+'</span><span>🪙 '+S.coins+'</span>';$('menu').classList.remove('hide');$('end').classList.add('hide');$('hud').style.display='none'}
const UP=[['rate','سرعة الإطلاق',l=>50+l*40],['count','عدد الشخصيات لكل طلقة',l=>120+l*150],['ammo','الذخيرة',l=>60+l*60],['time','وقت جمع العملات (+1.5ث)',l=>80+l*70]];let pend=null;
const CS=[['كلاسيكي',0xe67e22,0],['أزرق',0x2e8bff,250],['ذهبي',0xf1c40f,600]],MS=[['كرة صفراء',0xffd23f,'s',0],['مكعب وردي',0xff5fa2,'b',300],['مخروط أخضر',0x3ddc84,'c',500],['كرة سماوية',0x35d0ff,'s',700]];
const geos={s:mobGeo,b:new THREE.BoxGeometry(.5,.5,.5),c:new THREE.ConeGeometry(.3,.6,8)};
function applySkins(){cb.material.color.set(CS[S.cs][1]);const m=MS[S.ms];inst.material.color.set(m[1]);inst.geometry=geos[m[2]]}
function skinRows(){const h=document.createElement('h3');h.textContent='الأشكال';h.style.margin='6px 0 0';$('sl').appendChild(h);CS.forEach((s,i)=>addSkin('مدفع '+s[0],'oc','cs',i,s[2]));MS.forEach((s,i)=>addSkin(s[0],'om','ms',i,s[3]))}
function addSkin(n,ok,sk,i,cost){const row=document.createElement('div');row.className='row';const b=document.createElement('button'),own=S[ok].includes(i),cur=S[sk]===i,key=sk+i;b.textContent=cur?'مستخدم ✓':own?'استخدم':(pend===key?'تأكيد؟ -'+cost:cost+' 🪙');b.disabled=cur||(!own&&S.coins<cost);b.onclick=()=>{if(own){S[sk]=i;save();applySkins();shop();return}if(pend!==key){pend=key;shop();return}S.coins-=cost;S[ok].push(i);S[sk]=i;pend=null;save();applySkins();shop()};row.innerHTML='<span>'+n+'</span>';row.appendChild(b);$('sl').appendChild(row)}
function shop(){$('sc').innerHTML='<span>رصيدك</span><b>🪙 '+S.coins+'</b>';$('sl').innerHTML='';
 for(const[k,n,f]of UP){const l=S.up[k],c=f(l),row=document.createElement('div');row.className='row';const b=document.createElement('button');
  b.textContent=pend===k?'تأكيد؟ -'+c:c+' 🪙';b.disabled=l>=10||S.coins<c;if(l>=10)b.textContent='الحد الأقصى';
  b.onclick=()=>{if(pend!==k){pend=k;shop();return}S.coins-=c;S.up[k]++;pend=null;save();shop()};
  row.innerHTML='<span>'+n+' (م'+l+')</span>';row.appendChild(b);$('sl').appendChild(row)}skinRows()}
$('go').onclick=start;$('en').onclick=start;$('eh').onclick=menu;$('shopb').onclick=()=>{pend=null;shop();$('menu').classList.add('hide');$('shop').classList.remove('hide')};
$('sb').onclick=()=>{$('shop').classList.add('hide');menu()};
const cv=$('c'),setAim=e=>{aim=Math.max(-1,Math.min(1,(e.clientX/innerWidth-.5)*2.6))};
cv.addEventListener('pointerdown',e=>{if(state!=='play')return;hold=true;setAim(e);try{cv.setPointerCapture(e.pointerId)}catch(x){}});
cv.addEventListener('pointermove',e=>{if(hold&&state==='play')setAim(e)});
const rel=()=>{hold=false};cv.addEventListener('pointerup',rel);cv.addEventListener('pointercancel',rel);
let pt=performance.now();
function loop(t){requestAnimationFrame(loop);const dt=Math.min((t-pt)/1000,.05);pt=t;
 if(state==='play'&&G&&!G.over){update(dt);$('hl').textContent='المستوى '+G.L;$('ha').textContent='الذخيرة '+G.ammo;$('hh').textContent=G.bn?'⏱ '+Math.max(0,G.bonus).toFixed(1):'العدو '+Math.max(0,G.hp);$('hc').textContent='👥 '+mobs.length+' 🪙'+G.earn}
 for(let i=fx.length-1;i>=0;i--){const f=fx[i];f.t-=dt;f.vy-=18*dt;f.m.position.x+=f.vx*dt;f.m.position.y=Math.max(.1,f.m.position.y+f.vy*dt);f.m.position.z+=f.vz*dt;f.m.material.opacity=Math.max(0,f.t/.6);if(f.t<=0){sc.remove(f.m);f.m.material.dispose();fx.splice(i,1)}}
 inst.count=mobs.length;for(let i=0;i<mobs.length;i++){dummy.position.set(mobs[i].x,.4,mobs[i].z);dummy.updateMatrix();inst.setMatrixAt(i,dummy.matrix)}inst.instanceMatrix.needsUpdate=true;
 let fz=8;if(G&&mobs.length){let mz=0;for(const m of mobs)if(m.z<mz)mz=m.z;fz=Math.max(-G.len-16,Math.min(8,mz+13))}camZ+=(fz-camZ)*Math.min(1,dt*3);
 cam.position.set(0,8.5,camZ);cam.lookAt(0,0,camZ-13);R.render(sc,cam)}
$('dg').onclick=()=>{const t=new Date().toISOString().slice(0,10),b=$('dg');if(S.daily===t){b.textContent='تعالى بكرة 🎁';return}S.daily=t;S.coins+=50;save();b.textContent='+50 🪙 تمت الإضافة';menu()};
$('snb').onclick=()=>{snd=!snd;$('snb').textContent=snd?'🔊 الصوت: تشغيل':'🔇 الصوت: إيقاف'};
applySkins();gen(S.level);menu();requestAnimationFrame(loop);
</script></body></html>
